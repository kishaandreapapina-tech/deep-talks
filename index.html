<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Talks</title>
<style>
  body {
    font-family: 'Playfair Display', serif;
    background-color: #fff;
    color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    flex-direction: column;
    transition: opacity 0.4s ease;
  }
  .card {
    width: 90%;
    max-width: 400px;
    border: 1px solid #000;
    border-radius: 20px;
    padding: 40px 20px;
    font-size: 1.1rem;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
    min-height: 180px;
  }
  .buttons {
    margin-top: 25px;
  }
  button {
    background: none;
    border: 1px solid #000;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    margin: 0 8px;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #f4f4f4;
  }
</style>
</head>
<body>
  <div class="card" id="card">Welcome to <i>Deep Talks</i> — swipe right to begin.</div>
  <div class="buttons">
    <button onclick="prevCard()">← Prev</button>
    <button onclick="shuffleCards()">Shuffle</button>
    <button onclick="nextCard()">Next →</button>
  </div>

<script>
const cards = [
"Welcome to Deep Talks — swipe right to begin.",
"What do you think makes love last long-term?",
"What scares you most about falling in love?",
"What’s one memory you’ll never forget, no matter what?",
"How do you know when someone truly understands you?",
"When was the last time you felt completely at peace?",
"What’s one thing you wish your younger self could hear now?",
"Have you ever loved someone you couldn’t have?",
"What kind of love do you think you deserve?",
"What’s the hardest lesson you’ve learned about trust?",
"When do you feel most loved by someone?",
"What’s one thing that can instantly break your heart?",
"Do you believe in soulmates? Why or why not?",
"What’s your love language — and how do you show it?",
"How do you handle feeling jealous in a relationship?",
"What’s one truth about you that few people know?",
"What kind of future do you dream of sharing with someone?",
"Do you think love should be easy or take work?",
"What song reminds you of someone you loved deeply?",
"What’s the most meaningful compliment someone gave you?",
"When do you feel most vulnerable?",
"What’s something you’ve never told a past partner?",
"How do you express love when words aren’t enough?",
"What makes you feel emotionally safe with someone?",
"Would you rather be understood or adored?",
"What’s one small gesture that means a lot to you?",
"What’s your biggest fear in relationships?",
"When did you last feel genuinely appreciated?",
"What does 'forever' mean to you?",
"What do you think breaks most relationships?",
"Would you choose comfort or passion if you had to pick one?",
"What do you think your love story would be titled?",
"How do you usually heal after heartbreak?",
"What’s something that always makes you feel alive?",
"Do you believe people can change for love?",
"What’s one moment that changed the way you see love?",
"What kind of energy do you want in a relationship?",
"How do you know when to let go of someone?",
"What’s one thing you’re scared to lose?",
"Do you believe love can be unconditional?",
"What’s one thing you wish someone had said to you sooner?",
"How do you usually show affection?",
"What’s your definition of emotional intimacy?",
"Would you rather be loved deeply or for a long time?",
"What’s something you’ve learned from heartbreak?",
"When do you feel closest to someone?",
"What’s a love story you admire?",
"What’s one thing that gives you hope about love?",
"What kind of person brings out the best in you?",
"Do you think love is a choice or a feeling?",
"What does 'home' feel like to you?"
"What made you realize you were in love with me?"
"How do you define real love?"
"Do you think love can fade, or does it just change?"
"What scares you most about love?"
"What's one thing you’ve never told anyone about how you feel?"
"How do you want to be loved when you're sad?"
"What part of our relationship makes you feel safest?"
"How do you know when someone truly loves you?"
"What do you think keeps love alive even after the spark fades?"
];

let current = 0;
const card = document.getElementById('card');

function showCard(index) {
  document.body.style.opacity = 0;
  setTimeout(() => {
    card.textContent = cards[index];
    document.body.style.opacity = 1;
  }, 250);
}

function nextCard() {
  current = (current + 1) % cards.length;
  showCard(current);
}

function prevCard() {
  current = (current - 1 + cards.length) % cards.length;
  showCard(current);
}

function shuffleCards() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  current = 0;
  showCard(current);
}
</script>
</body>
</html>
